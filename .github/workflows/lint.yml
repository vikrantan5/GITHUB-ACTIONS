# what is the goal for the workflow
#check sybtax format and linting

name: Autolinter

on:
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    #this step will automatically clone the code of the current branch into the runner
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7
    #will install the linting tool
      - name: Install Linter
        run: pip install ruff
